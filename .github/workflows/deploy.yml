# Publica o ZoomBoard no GitHub Pages a cada push na branch main.
# Requer: Settings > Pages > Source = "GitHub Actions" (feito uma vez, manualmente).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Permite rodar manualmente pela aba Actions.
  workflow_dispatch:

# Permissões que o job precisa para publicar no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que só um deploy rode por vez (cancela o anterior em andamento).
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        # GITHUB_PAGES=true liga o basePath /ZoomBoard no next.config.mjs.
        env:
          GITHUB_PAGES: "true"
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
